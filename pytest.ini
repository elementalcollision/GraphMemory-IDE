[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short --strict-markers
testpaths = tests server/dashboard
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: mark test as asyncio
    unit: mark test as unit test
    integration: mark test as integration test
    slow: mark test as slow running
    real_time: mark test as real-time system test
    real_services: mark test as requiring real running services
    performance: mark test as performance benchmark
    mock_data: mark test as using mocked data
    load: mark test as load test
    external: mark test as requiring external services
    database: mark test as database integration test
    authentication: mark test as authentication test 